name: Verify SpinLab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  model-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: spinlab-xr-portable
          path: artifacts/spinlab-xr
          retention-days: 30
  native-science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl -L --fail -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import native project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --xr-mode off --path native --editor --import --quit
      - name: Verify numerical methods
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --xr-mode off --path native --script res://tests/test_science.gd
      - name: Verify native workflows
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --xr-mode off --path native --script res://tests/test_app.gd
      - name: Verify direct contact and virtual hands
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --xr-mode off --path native --script res://tests/test_direct_interaction.gd
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --xr-mode off --path native --script res://tests/test_hand_visual.gd
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --xr-mode off --path native --script res://tests/test_hands_app.gd
      - name: Verify tutorial state, layout, and lab integration
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --xr-mode off --path native --script res://tests/test_tutorial.gd
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --xr-mode off --path native --script res://tests/test_tutorial_panel.gd
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --xr-mode off --path native --script res://tests/test_tutorial_app.gd
